      summary: "Take a stay out of its group (booking/edit); GROUP_LAST_STAY"
      responses:
        "200": { description: "Booking" }
  /whole-villa-bookings:
    post:
      tags: [reservation]
      summary: "Book every villa unit of a villa as one booking group with wholeVilla true (booking/create); WHOLE_VILLA_NOT_ALLOWED, WHOLE_VILLA_UNAVAILABLE, UNIT_CAPACITY, DISCOUNT_LIMIT"
      description: |
        One confirmed stay per villa-kind unit that is not inactive, same dates, the lead guest, on a master folio. The party spreads
        over the units by their capacity. Nightly price: price.nightly when given (the discount limit applies as on any direct price
        change), else the villa's wholeNightlyRate when above 0, each shared evenly over the stays with the remainder on the first;
        else each unit's own price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [villaId, checkIn, checkOut, adults, children, source]
              properties:
                villaId: { type: string }
                guestId: { type: [string, "null"] }
                newGuest: { $ref: "#/components/schemas/GuestInput" }
                checkIn: { type: string, format: date }
                checkOut: { type: string, format: date }
                adults: { type: integer, minimum: 1 }
                children: { type: integer, minimum: 0 }
                source: { enum: [direct, airbnb], description: "The group's source; the stays are direct stays as in any group" }
                note: { type: string }
                price: { type: object, required: [nightly, reason], properties: { nightly: { type: integer, minimum: 1 }, reason: { type: string } } }
      responses:
        "201": { description: "BookingGroup with wholeVilla true, as GET /booking-groups lists it" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /booking-groups/{id}/payments:
    post:
      tags: [reservation]
      summary: "One payment over the group's stays (payments/create); needs billing"
      responses:
        "200": { description: "{ payments, link }" }
  /stay-restrictions:
    get:
      tags: [reservation]
      summary: "Stay restrictions of room types in scope"
      responses:
        "200": { description: "Restriction[]" }
    post:
      tags: [reservation]
      summary: "Add a restriction (property/edit)"
      responses:
        "201": { description: "Restriction" }
  /stay-restrictions/bulk:
    post:
      tags: [reservation]
      summary: "One rule for several room types, all or nothing (property/edit)"
      responses:
        "201": { description: "Restriction[]" }
  /stay-restrictions/{id}:
    put:
      tags: [reservation]
      summary: "Replace a restriction (property/edit)"
      responses:
        "200": { description: "Restriction" }
    delete:
      tags: [reservation]
      summary: "Remove a restriction (property/edit)"
      responses:
        "204": { description: "Removed" }
  /overbooking-policies:
    get:
      tags: [reservation]
      summary: "Overbooking policies of room types in scope"
      responses:
        "200": { description: "OverbookPolicy[]" }
  /unit-groups/{id}/overbooking:
    put:
      tags: [reservation]
      summary: "Stays a night past the rooms, 0 to 5 (property/edit); OVERBOOK_ROOM_BY_ROOM"
      responses:
        "200": { description: "OverbookPolicy" }
  /walks:
    get:
      tags: [reservation]
      summary: "Guests walked off overbooked nights"
      responses:
        "200": { description: "Walk[]" }
  /pre-checkins:
    get:
      tags: [reservation]
      summary: "Online check-ins the guests sent"
      responses:
        "200": { description: "PreCheckIn[]" }
  /checkin/{token}:
    get:
      tags: [reservation]
      summary: "Public: the stay and the form behind the link; PRECHECKIN_LINK_EXPIRED"
      responses:
        "200": { description: "PublicPreCheckIn, with the villa's checkInTime and checkOutTime (HH:MM) when known" }
    put:
      tags: [reservation]
      summary: "Public: send or update the form; PRECHECKIN_LOCKED"
      responses:
        "200": { description: "PublicPreCheckIn" }
  /checkin/{token}/pay:
    post:
      tags: [reservation]
      summary: "Public: a gateway link for the room balance; needs billing"
      responses:
        "200": { description: "PaymentLink" }

  /menu-items:
    get:
      tags: [services]
      summary: "The room service menu of the villas in scope"
      responses:
        "200": { description: "MenuItem[]" }
    post:
      tags: [services]
      summary: "Add an item with hours, notice, photo, price and partner cost (services/catalog)"
      responses:
        "201": { description: "MenuItem" }
  /menu-items/{id}:
    patch:
      tags: [services]
      summary: "Edit an item (services/catalog)"
      responses:
        "200": { description: "MenuItem" }
  /service-partners:
    get:
      tags: [services]
      summary: "Partners who deliver part of the menu"
      responses:
        "200": { description: "ServicePartner[]" }
    post:
      tags: [services]
      summary: "Add a partner (services/catalog)"
      responses:
        "201": { description: "ServicePartner" }
  /service-partners/{id}:
    patch:
      tags: [services]
      summary: "Edit a partner (services/catalog)"
      responses:
        "200": { description: "ServicePartner" }
  /service-orders:
    get:
      tags: [services]
      summary: "Orders of the villas in scope, oldest first"
      responses:
        "200": { description: "ServiceOrder[]" }
    post:
      tags: [services]
      summary: "Order from the desk (services/create); ORDER_NO_STAY, ITEM_UNAVAILABLE, ITEM_LEAD_TIME, COMP_FORBIDDEN, DISCOUNT_LIMIT"
      responses:
        "201": { description: "ServiceOrder" }
  /service-orders/{id}:
    patch:
      tags: [services]
      summary: "{ assignee }: who takes the order (services/edit)"
      responses:
        "200": { description: "ServiceOrder" }
  /service-orders/{id}/{action}:
    post:
      tags: [services]
      summary: "accept, prepare, deliver, cancel or void with { note } (services/edit); ORDER_INVALID_STATE, VOID_DAY_CLOSED, ORDER_VOID_PAID; deliver publishes services.order.delivered.v1"
      parameters:
        - { name: action, in: path, required: true, schema: { enum: [accept, prepare, deliver, cancel, void] } }
      responses:
        "200": { description: "ServiceOrder" }
  /order/{token}:
    get:
      tags: [services]
      summary: "Public: the room's menu and the current stay's orders, from the QR card token"
      responses:
        "200": { description: "PublicMenu" }
    post:
      tags: [services]
      summary: "Public: the guest orders { lines, note, requestedOn, requestedAt } at menu prices; ORDER_NO_STAY"
      responses:
        "200": { description: "PublicMenu" }
  /order/{token}/pay:
    post:
      tags: [services]
      summary: "Public: a QRIS link for the delivered, unpaid orders; ORDER_NOT_BILLABLE; needs billing"
      responses:
        "200": { description: "PaymentLink" }
  /service-requests:
    get:
      tags: [services]
      summary: "Requests (towels, cleaning, repairs) on the units in scope"
      responses:
        "200": { description: "ServiceRequest[]" }
    post:
      tags: [services]
      summary: "Log a request (services/create)"
      responses:
        "201": { description: "ServiceRequest" }
  /service-requests/{id}:
    patch:
      tags: [services]
      summary: "The full form, { assignee } or { transactionId } (services/edit); REQUEST_INVALID_STATE"
      responses:
        "200": { description: "ServiceRequest" }
  /service-requests/{id}/{action}:
    post:
      tags: [services]
      summary: "start, done or cancel (services/edit); REQUEST_INVALID_STATE"
      parameters:
        - { name: action, in: path, required: true, schema: { enum: [start, done, cancel] } }
      responses:
        "200": { description: "ServiceRequest" }

components:
  securitySchemes:
    cookie: { type: apiKey, in: cookie, name: wit_access }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
  requestBodies:
    Json:
      required: true
      content: { application/json: { schema: { type: object } } }
  responses:
    Data:
      description: "`{ data }` in the shape of the matching TypeScript port"
      content: { application/json: { schema: { type: object, properties: { data: {} } } } }
    Problem:
      description: A refusal with the code the console shows
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    TravelDocument:
      type: object
      properties:
        nationality: { type: string, description: ISO 3166-1 alpha-2 }
        idType: { type: string, enum: [passport, kitas, kitap, ktp] }
        idNumber: { type: string }
        idExpiry: { type: [string, "null"], format: date }
        birthDate: { type: [string, "null"], format: date }
        sex: { type: [string, "null"], enum: [male, female, null] }
        birthPlace: { type: string }
        entryDate: { type: [string, "null"], format: date }
        entryPort: { type: string }
        visaType: { type: [string, "null"], enum: [voa, evoa, b211, kitas, free, null] }
        addressInIndonesia: { type: string }
    Guest:
      allOf:
        - $ref: "#/components/schemas/TravelDocument"
        - type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            notes: { type: string }
            preferences: { type: object, additionalProperties: { type: string } }
            vipLevel: { type: integer, minimum: 0, maximum: 3 }
            vipReason: { type: string }
            tags: { type: array, items: { type: string } }
            blacklist: { type: [object, "null"], properties: { reason: { type: string }, setBy: { type: string }, setOn: { type: string, format: date } } }
            createdOn: { type: string, format: date }
    GuestInput:
      allOf:
        - $ref: "#/components/schemas/TravelDocument"
        - type: object
          required: [name, email, phone, nationality, idType, idNumber, notes]
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            notes: { type: string }
            preferences: { type: object, additionalProperties: { type: string } }
            vipLevel: { type: integer }
            vipReason: { type: string }
            tags: { type: array, items: { type: string } }
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, ACCESS_SELF, UNIT_IN_USE] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            ok: { type: boolean }
            version: { type: string }
            service: { type: string }
            db: { type: string }
            bus: { type: string }
            contexts: { type: array, items: { type: string } }
    Role: { enum: [owner, management, finance, hr, reservation, manager, staff, admin, investor] }
    Module: { enum: [dashboard, property, airbnb, booking, guest, services, maintenance, payments, finance, approval, hr, payroll, reports, access, master, me, portal] }
    Action: { enum: [view, create, edit, submit, approve, post, report, catalog, comp] }
    RolePermissions:
      type: object
      additionalProperties: { type: array, items: { $ref: "#/components/schemas/Action" } }
    Permissions:
      type: object
      additionalProperties: { $ref: "#/components/schemas/RolePermissions" }
    User:
      type: object
      properties:
        id: { type: string, examples: [usr-kadek] }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { enum: [active, inactive] }
        locationIds: { type: array, items: { type: string } }
        villaIds: { type: array, items: { type: string } }
        employeeId: { type: [string, "null"] }
        lastLoginOn: { type: [string, "null"], format: date }
        createdOn: { type: string, format: date }
    UserEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/User" } } }
    UserInput:
      type: object
      required: [name, email, role, status, locationIds, villaIds, employeeId]
      properties:
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { enum: [active, inactive] }
        locationIds: { type: array, items: { type: string } }
        villaIds: { type: array, items: { type: string } }
        employeeId: { type: [string, "null"] }
    LoginInput:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string } }
    PasswordChange:
      type: object
      required: [current, next, confirm]
      properties: { current: { type: string }, next: { type: string }, confirm: { type: string } }
    Profile:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        locationIds: { type: array, items: { type: string } }
        villaIds: { type: array, items: { type: string } }
        employeeId: { type: [string, "null"] }
        notifyArrivals: { type: boolean }
        notifyApprovals: { type: boolean }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        at: { type: string, description: "Local date-time YYYY-MM-DDTHH:MM:SS" }
        userId: { type: string }
        userName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        action: { enum: [create, update, delete, status, approve, reject, login, logout, denied] }
        entity: { type: string }
        entityId: { type: string }
        summary: { type: string }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
    Location:
      type: object
      properties: { id: { type: string }, name: { type: string }, area: { type: string } }
    LocationInput:
      type: object
      required: [name, area]
      properties: { name: { type: string }, area: { type: string } }
    Photo:
      type: object
      required: [fileId, caption]
      properties:
        fileId: { type: string, description: "An upload from POST /files: jpeg, png, webp or heic" }
        caption: { type: string }
    VillaProfile:
      type: object
      properties:
        address: { type: string }
        lat: { type: [number, "null"], minimum: -90, maximum: 90, description: "Both lat and lng, or neither" }
        lng: { type: [number, "null"], minimum: -180, maximum: 180 }
        phone: { type: string }
        email: { type: string, description: "A valid email or empty" }
        checkInTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", default: "14:00" }
        checkOutTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", default: "12:00", description: "Earlier than checkInTime" }
        licenseNo: { type: string, description: "NIB or Pondok Wisata permit" }
        bankName: { type: string }
        bankAccountNo: { type: string, pattern: "^\\d*$" }
        bankAccountName: { type: string }
        houseRules: { type: string, maxLength: 4000 }
        cancellationPolicy: { enum: [flexible, moderate, strict, non_refundable], default: moderate }
        depositKind: { enum: [none, percent, fixed], default: none }
        depositValue: { type: integer, description: "Percent 1 to 100, fixed rupiah above 0, 0 when none" }
        photos: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Photo" }, description: "The first is the cover" }
    Villa:
      allOf:
        - type: object
          properties:
            id: { type: string }
            locationId: { type: string }
            code: { type: string, pattern: "^[A-Z]{2,4}$" }
            name: { type: string }
            description: { type: string }
            facilities: { type: array, items: { type: string } }
        - $ref: "#/components/schemas/VillaProfile"
        - $ref: "#/components/schemas/Operating"
    Operating:
      type: object
      description: "How the property operates. On create, left out: villa, stayoverEvery 1 in a hotel or mixed and 0 in a villa, no whole rental, depositOnCheckIn false in a hotel and true otherwise. On edit, left out keeps the villa's (stayoverEvery and depositOnCheckIn take the new operation's default when the operation changes). Changing to hotel or villa turns every room type into rooms or villas."
      properties:
        operation: { enum: [villa, hotel, mixed] }
        stayoverEvery: { type: integer, minimum: 0, maximum: 7, description: "Days between stayover cleans of a guest in house, 0 none; in a mixed property rooms only" }
        wholeRental: { type: boolean, description: "False in a hotel (field error \"A hotel is not rented whole.\"); the wizard needs two villa units" }
        wholeNightlyRate: { type: integer, minimum: 0, description: "Whole villa price a night; 0 is the sum of its villa units' prices" }
        depositOnCheckIn: { type: boolean, description: "Ask a security deposit at check-in; villa units only in a mixed property" }
    VillaInput:
      allOf:
        - type: object
          required: [locationId, code, name, description, facilities]
          properties:
            locationId: { type: string }
            code: { type: string }
            name: { type: string }
            description: { type: string }
            facilities: { type: array, items: { type: string } }
        - $ref: "#/components/schemas/VillaProfile"
        - $ref: "#/components/schemas/Operating"
      description: "Empty times, policy and deposit kind take their defaults; photos left out keep the villa's"
    UnitGroup:
      type: object
      properties:
        id: { type: string }
        villaId: { type: string }
        name: { type: string }
        interchangeable: { type: boolean }
        operatorAssigns: { type: boolean }
        kind: { enum: [room, villa], description: "A unit's kind is its room type's; a unit without one is a room in a hotel and a villa otherwise" }
    GroupInput:
      type: object
      required: [villaId, name, interchangeable, operatorAssigns]
      properties:
        villaId: { type: string }
        name: { type: string }
        interchangeable: { type: boolean }
        operatorAssigns: { type: boolean }
        kind: { enum: [room, villa], description: "Left out: the room type's, or for a new one room in a hotel and villa otherwise. GROUP_KIND (with the field) when a hotel gets villas (\"A Hotel only has rooms.\") or a villa rooms (\"A Villa only has villas.\")" }
    Bed:
      type: object
      required: [type, count]
      properties:
        type: { enum: [king, queen, double, twin, single, sofa_bed, bunk], description: "Each type at most once" }
        count: { type: integer, minimum: 1 }
    UnitRoom:
      type: object
      description: "A party fits when adults <= maxAdults + extraBeds and adults + children <= maxAdults + maxChildren + extraBeds"
      properties:
        maxAdults: { type: integer, minimum: 1, description: "Left out: two per bedroom for a new unit, unchanged on edit" }
        maxChildren: { type: integer, minimum: 0, description: "Left out: one per bedroom for a new unit, unchanged on edit" }
        beds: { type: array, items: { $ref: "#/components/schemas/Bed" } }
        sizeSqm: { type: [integer, "null"], minimum: 1 }
        view: { enum: ["", garden, pool, ocean, rice_field, jungle, mountain, city] }
        extraBeds: { type: integer, minimum: 0, maximum: 4 }
        extraBedRate: { type: integer, description: "Rupiah per night, above 0 when extraBeds > 0, else 0" }
        photos: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Photo" } }
        floor: { type: string, maxLength: 10, description: "For hotel rooms, for example 2 or G; may be empty" }
    Unit:
      allOf:
        - type: object
          properties:
            id: { type: string, examples: [unit-sk-01] }
            villaId: { type: string }
            groupId: { type: [string, "null"] }
            code: { type: string, pattern: "^[A-Z]{2,4}-\\d{2,4}$", description: "Two to four digits, so hotel room numbers like HT-201 fit" }
            name: { type: string }
            bedrooms: { type: integer }
            nightlyRate: { type: integer }
            status: { enum: [active, cleaning, maintenance, inactive] }
            amenities: { type: array, items: { type: string } }
            statusReason: { type: string, description: "Read only: why the unit has its status" }
            statusUntil: { type: [string, "null"], format: date, description: "Read only: expected return of a unit out of service" }
        - $ref: "#/components/schemas/UnitRoom"
    UnitInput:
      allOf:
        - type: object
          required: [villaId, groupId, code, name, bedrooms, nightlyRate, status, amenities]
          properties:
            villaId: { type: string }
            groupId: { type: [string, "null"] }
            code: { type: string }
            name: { type: string }
            bedrooms: { type: number }
            nightlyRate: { type: number }
            status: { enum: [active, cleaning, maintenance, inactive] }
            amenities: { type: array, items: { type: string } }
            statusReason: { type: string, description: "Required when the status changes to maintenance or inactive" }
            statusUntil: { type: [string, "null"], format: date, description: "Optional with maintenance or inactive, not before today" }
        - $ref: "#/components/schemas/UnitRoom"
    StatusChange:
      type: object
      properties:
        id: { type: string }
        unitId: { type: string }
        from: { enum: ["", active, cleaning, maintenance, inactive], description: "Empty on the first row of a unit created out of service" }
        to: { enum: [active, cleaning, maintenance, inactive] }
        reason: { type: string }
        until: { type: [string, "null"], format: date }
        by: { type: string, description: "The user's name, or Housekeeping or Maintenance" }
        at: { type: string, format: date-time }
    Season:
      type: object
      properties:
        name: { type: string }
        from: { type: string, pattern: "^\\d{2}-\\d{2}$" }
        to: { type: string, pattern: "^\\d{2}-\\d{2}$" }
        kind: { enum: [fixed, surcharge] }
        value: { type: integer }
    RatePlan:
      type: object
      properties:
        groupId: { type: string }
        weekdayRate: { type: integer }
        weekendRate: { type: integer }
        seasons: { type: array, items: { $ref: "#/components/schemas/Season" } }
    RatePlanInput:
      type: object
      required: [weekdayRate, weekendRate, seasons]
      properties:
        weekdayRate: { type: number }
        weekendRate: { type: number }
        seasons: { type: array, items: { $ref: "#/components/schemas/Season" } }
    PropertyInput:
      type: object
      required: [villa, groups, rooms]
      properties:
        villa: { $ref: "#/components/schemas/VillaInput" }
        groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { enum: [room, villa], description: "Left out: room in a hotel, villa otherwise; must fit the operation (GROUP_KIND, field groups.N.kind)" }
              interchangeable: { type: boolean, description: "Left out: true for rooms, false for villas" }
              operatorAssigns: { type: boolean, description: "Left out: true for rooms, false for villas" }
              minStay: { type: integer, minimum: 1, maximum: 90, description: "Left out: 1 for rooms, 2 for villas. Above 1 it is saved as a yearly min_stay stay restriction on the room type (id rst-min-<groupId>), editable under /stay-restrictions" }
              plan: { $ref: "#/components/schemas/RatePlanInput" }
        rooms:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  code: { type: string }
                  name: { type: string }
                  bedrooms: { type: number }
                  nightlyRate: { type: number }
                  groupIndex: { type: [integer, "null"] }
                  amenities: { type: array, items: { type: string } }
                  plan: { $ref: "#/components/schemas/RatePlanInput" }
              - $ref: "#/components/schemas/UnitRoom"
    UnitBlock:
      type: object
      properties:
        id: { type: string }
        unitId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Exclusive, like a check-out }
        reason: { enum: [maintenance, owner, cleaning, other] }
        note: { type: string }
    BlockInput:
      type: object
      required: [unitId, from, to, reason, note]
      properties:
        unitId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        reason: { enum: [maintenance, owner, cleaning, other] }
        note: { type: string }
