openapi: 3.1.0
info:
  title: Bali Villa Console API
  version: 0.1.0
  description: |
    The /api/v1 contract of src/infrastructure/http/index.ts. Success is `{ "data": ... }`,
    failure is `{ "error": { "code", "message", "fields"? } }` where `code` is the RuleError code the
    console shows. An empty answer is 204. Sessions travel in httpOnly cookies (`wit_access`,
    `wit_refresh`); an expired access cookie is renewed from the refresh cookie on any call.
    Phase 0 covers identity and access, and the property context; phase 3 adds maintenance and inventory.
servers:
  - url: http://localhost:8080/api/v1
security:
  - cookie: []
tags:
  - name: platform
  - name: identity
  - name: property
  - name: maintenance
  - name: inventory
paths:
  /health:
    get:
      tags: [platform]
      security: []
      summary: Liveness with database and bus state
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthEnvelope" } } } }
        "503": { description: Database or bus down }
  /docs/openapi.yaml:
    get:
      tags: [platform]
      security: []
      summary: This document
      responses:
        "200": { description: OpenAPI document }

  /auth/session:
    get:
      tags: [identity]
      summary: The signed-in user, or null
      responses:
        "200": { description: User or null, content: { application/json: { schema: { type: object, properties: { data: { oneOf: [ { $ref: "#/components/schemas/User" }, { type: "null" } ] } } } } } }
  /auth/login:
    post:
      tags: [identity]
      security: []
      summary: Sign in with email and password; sets the session cookies
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginInput" } } } }
      responses:
        "200": { description: The user, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
        "401": { $ref: "#/components/responses/Problem", description: INVALID_CREDENTIALS }
        "403": { $ref: "#/components/responses/Problem", description: USER_INACTIVE }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [identity]
      summary: End the session and clear the cookies
      responses:
        "204": { description: Signed out }
  /auth/refresh:
    post:
      tags: [identity]
      summary: Rotate the refresh token ahead of expiry (the middleware also renews on its own)
      responses:
        "200": { description: The user, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/password:
    post:
      tags: [identity]
      summary: Change the password; other sessions end
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordChange" } } } }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Problem", description: INVALID_CREDENTIALS when the current password is wrong }
        "422": { $ref: "#/components/responses/Problem" }
  /users:
    get:
      tags: [identity]
      summary: Every login (access/view)
      responses:
        "200": { description: Users, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/User" } } } } } } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [identity]
      summary: Add a login (access/create); it starts with the initial password
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UserInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /users/{id}:
    patch:
      tags: [identity]
      summary: Edit a login with the whole form, or send `{ status }` alone to (de)activate it (access/edit)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/UserInput"
                - { type: object, required: [status], properties: { status: { enum: [active, inactive] } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
        "409": { $ref: "#/components/responses/Problem", description: ACCESS_SELF }
  /permissions:
    get:
      tags: [identity]
      summary: The role and permission matrix
      responses:
        "200": { description: Matrix, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Permissions" } } } } } }
  /permissions/{role}:
    put:
      tags: [identity]
      summary: Replace one role's row (access/edit; only the owner edits the owner)
      parameters: [ { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/Role" } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RolePermissions" } } } }
      responses:
        "200": { description: The whole matrix, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Permissions" } } } } } }
        "403": { $ref: "#/components/responses/Problem", description: FORBIDDEN or ACCESS_OWNER }
  /audit:
    get:
      tags: [identity]
      summary: The audit trail, newest first (access/view)
      responses:
        "200": { description: Entries, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } } } }
  /me:
    get:
      tags: [identity]
      summary: The signed-in person's profile
      responses:
        "200": { description: Profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Profile" } } } } } }
    put:
      tags: [identity]
      summary: Save name, email and notification choices
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
      responses:
        "200": { description: Profile, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Profile" } } } } } }

  /locations:
    get:
      tags: [property]
      summary: Locations in the user's scope
      responses:
        "200": { description: Locations, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Location" } } } } } } }
    post:
      tags: [property]
      summary: Add a location (master/create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Location" } } } } } }
  /locations/{id}:
    patch:
      tags: [property]
      summary: Edit a location (master/edit)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LocationInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Location" } } } } } }
  /villas:
    get:
      tags: [property]
      summary: Villas in the user's scope
      responses:
        "200": { description: Villas, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Villa" } } } } } } }
    post:
      tags: [property]
      summary: Add a villa without rooms (master/create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VillaInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Villa" } } } } } }
  /villas/{id}:
    patch:
      tags: [property]
      summary: Edit a villa (master/edit)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VillaInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Villa" } } } } } }
  /properties:
    post:
      tags: [property]
      summary: The New property wizard; villa, room types with rate plans and rooms in one transaction (master/create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PropertyInput" } } } }
      responses:
        "201": { description: The new villa, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Villa" } } } } } }
        "422": { $ref: "#/components/responses/Problem", description: "Field keys like villa.code, rooms.2.code, plans.g0.weekdayRate" }
  /unit-groups:
    get:
      tags: [property]
      summary: Room types in the user's scope
      responses:
        "200": { description: Room types, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/UnitGroup" } } } } } } }
    post:
      tags: [property]
      summary: Add a room type (master/create)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/UnitGroup" } } } } } }
  /unit-groups/{id}:
    patch:
      tags: [property]
      summary: Edit a room type (master/edit or property/edit); ROOMS_TO_ASSIGN while stays wait for a room
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/UnitGroup" } } } } } }
  /unit-groups/{id}/rate-plan:
    put:
      tags: [property]
      summary: Create or replace the room type's rate plan (property/edit)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RatePlanInput" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/RatePlan" } } } } } }
  /units:
    get:
      tags: [property]
      summary: Units in the user's scope
      responses:
        "200": { description: Units, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Unit" } } } } } } }
    post:
      tags: [property]
      summary: Add a unit (master/create); a room type without a plan starts one from the unit's base price
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UnitInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Unit" } } } } } }
  /units/{id}:
    patch:
      tags: [property]
      summary: Edit a unit (master/edit or property/edit); UNIT_IN_USE when deactivating with stays ahead
      parameters: [ { $ref: "#/components/parameters/id" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UnitInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/Unit" } } } } } }
  /rate-plans:
    get:
      tags: [property]
      summary: Rate plans of room types in the user's scope
      responses:
        "200": { description: Plans, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/RatePlan" } } } } } } }
  /unit-blocks:
    get:
      tags: [property]
      summary: Unit blocks in the user's scope
      responses:
        "200": { description: Blocks, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/UnitBlock" } } } } } } }
    post:
      tags: [property]
      summary: Block a unit (booking/create or property/edit); BLOCK_OVERLAP over a stay
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BlockInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/UnitBlock" } } } } } }
  /unit-blocks/{id}:
    delete:
      tags: [property]
      summary: Remove a block (booking/edit or property/edit)
      parameters: [ { $ref: "#/components/parameters/id" } ]
      responses:
        "204": { description: Removed }
  /facilities:
    get:
      tags: [property]
      summary: The villa facility and unit amenity lists (API extra; the console has them built in)
      responses:
        "200": { description: Lists }
  /work-orders:
    get: { tags: [maintenance], summary: Work orders of villas in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [maintenance], summary: Open a job (maintenance/create); blockFrom and blockTo hold the unit, BLOCK_OVERLAP over a stay, requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /work-orders/{id}:
    patch: { tags: [maintenance], summary: Edit a job (maintenance/edit); WORK_ORDER_INVALID_STATE once verified or cancelled, parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /work-orders/{id}/status:
    post: { tags: [maintenance], summary: "Move a job: { status, note } (verified needs maintenance/approve); done or cancelled frees the unit", parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /work-orders/{id}/notes:
    post: { tags: [maintenance], summary: "Add a history note: { note }", parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /work-orders/{id}/block:
    put: { tags: [maintenance], summary: "Hold the unit { from, to } or release it with nulls", parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /work-orders/{id}/expenses:
    post: { tags: [maintenance], summary: Add an expense line and submit its cash-out (maintenance/submit), parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /work-orders/{id}/expenses/{expenseId}:
    put: { tags: [maintenance], summary: Correct a rejected expense and resubmit it; TRANSACTION_INVALID_STATE otherwise, parameters: [ { $ref: "#/components/parameters/id" }, { name: expenseId, in: path, required: true, schema: { type: string } } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /assets:
    get: { tags: [maintenance], summary: Assets of villas in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [maintenance], summary: Register an asset (maintenance/create), requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /assets/{id}:
    patch: { tags: [maintenance], summary: Edit an asset (maintenance/edit), parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /vendors:
    get: { tags: [maintenance], summary: Every vendor, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [maintenance], summary: Add a vendor (maintenance/create), requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /vendors/{id}:
    patch: { tags: [maintenance], summary: Edit a vendor (maintenance/edit), parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /preventive-plans:
    get: { tags: [maintenance], summary: Preventive plans of villas in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [maintenance], summary: Add a plan (maintenance/create), requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /preventive-plans/{id}:
    patch: { tags: [maintenance], summary: Edit a plan (maintenance/edit), parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /preventive-plans/generate:
    post: { tags: [maintenance], summary: "Open a job per active plan due within { horizonDays } with none open", requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /stock/items:
    get: { tags: [inventory], summary: Every stock item with its replayed average cost, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [inventory], summary: Add an item (maintenance/create), requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /stock/items/{id}:
    patch: { tags: [inventory], summary: Edit an item (maintenance/edit), parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /stock/movements:
    get: { tags: [inventory], summary: Movements of stores in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [inventory], summary: Issue, transfer or write off (maintenance/edit); STOCK_SHORT past what the store holds, requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /stock/receipts:
    get: { tags: [inventory], summary: Receipts of stores in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [inventory], summary: Book goods in and submit the purchase cash-out (maintenance/submit), requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /stock/receipts/{id}:
    put: { tags: [inventory], summary: Correct a rejected purchase; STOCK_SHORT when used stock would go below zero, parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /stock/receipts/{id}/cancel:
    post: { tags: [inventory], summary: "Give up a rejected purchase { reason }; its stock leaves the store", parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /stock/counts:
    get: { tags: [inventory], summary: Counts of stores in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
    post: { tags: [inventory], summary: Record a count; differences post as adjustments (maintenance/edit), requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }
  /stock/kits:
    get: { tags: [inventory], summary: Amenity kits of room types in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /stock/kits/{id}:
    put: { tags: [inventory], summary: "Set a room type's kit { lines }; an empty list removes it", parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /stock/minibar-links:
    get: { tags: [inventory], summary: Minibar menu item to stock item links in scope, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /stock/minibar-links/{id}:
    put: { tags: [inventory], summary: "Link a minibar menu item { stockItemId } or unlink with null", parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "200": { $ref: "#/components/responses/Data" } } }
  /bookings/{id}/minibar-checks:
    post: { tags: [inventory], summary: What a guest in house took from the minibar (services/create); ORDER_NO_STAY otherwise, parameters: [ { $ref: "#/components/parameters/id" } ], requestBody: { $ref: "#/components/requestBodies/Json" }, responses: { "201": { $ref: "#/components/responses/Data" } } }

components:
  securitySchemes:
    cookie: { type: apiKey, in: cookie, name: wit_access }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
  requestBodies:
    Json:
      required: true
      content: { application/json: { schema: { type: object } } }
  responses:
    Data:
      description: "`{ data }` in the shape of the matching TypeScript port"
      content: { application/json: { schema: { type: object, properties: { data: {} } } } }
    Problem:
      description: A refusal with the code the console shows
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, ACCESS_SELF, UNIT_IN_USE] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            ok: { type: boolean }
            version: { type: string }
            service: { type: string }
            db: { type: string }
            bus: { type: string }
            contexts: { type: array, items: { type: string } }
    Role: { enum: [owner, management, finance, hr, reservation, manager, staff, admin, investor] }
    Module: { enum: [dashboard, property, airbnb, booking, guest, services, maintenance, payments, finance, approval, hr, payroll, reports, access, master, me, portal] }
    Action: { enum: [view, create, edit, submit, approve, post, report, catalog, comp] }
    RolePermissions:
      type: object
      additionalProperties: { type: array, items: { $ref: "#/components/schemas/Action" } }
    Permissions:
      type: object
      additionalProperties: { $ref: "#/components/schemas/RolePermissions" }
    User:
      type: object
      properties:
        id: { type: string, examples: [usr-kadek] }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { enum: [active, inactive] }
        locationIds: { type: array, items: { type: string } }
        villaIds: { type: array, items: { type: string } }
        employeeId: { type: [string, "null"] }
        lastLoginOn: { type: [string, "null"], format: date }
        createdOn: { type: string, format: date }
    UserEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/User" } } }
    UserInput:
      type: object
      required: [name, email, role, status, locationIds, villaIds, employeeId]
      properties:
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { enum: [active, inactive] }
        locationIds: { type: array, items: { type: string } }
        villaIds: { type: array, items: { type: string } }
        employeeId: { type: [string, "null"] }
    LoginInput:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string } }
    PasswordChange:
      type: object
      required: [current, next, confirm]
      properties: { current: { type: string }, next: { type: string }, confirm: { type: string } }
    Profile:
